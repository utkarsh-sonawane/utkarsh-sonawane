name: Update Profile Graphics

on:
  schedule:
    - cron: '17 5 * * *'   # daily at 05:17 UTC
  workflow_dispatch:

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate profile graphics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile.py

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(profile): refresh profile graphics"
            git push
          fi
